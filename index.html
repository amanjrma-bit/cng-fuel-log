:root{
  --bg:#E9EFEE; --panel:#FFFFFF; --ink:#0F2A2E; --muted:#56706F; --line:#C5D2D0;
  --teal:#0F5C66; --teal-ink:#FFFFFF; --yellow:#F2B705; --yellow-ink:#1A1400;
  --danger:#A8241B; --ok:#1F6B3A; --field:#F6F9F8;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A1C; --panel:#12262A; --ink:#E4EEEC; --muted:#8FA9A7; --line:#27403F;
    --teal:#4FA6B0; --teal-ink:#06191C; --field:#0E2023; --danger:#F07468; --ok:#6FCB8E;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1A1C; --panel:#12262A; --ink:#E4EEEC; --muted:#8FA9A7; --line:#27403F;
  --teal:#4FA6B0; --teal-ink:#06191C; --field:#0E2023; --danger:#F07468; --ok:#6FCB8E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.4;min-height:100%;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal);color:var(--teal-ink);padding:12px 14px 14px;margin:0 -14px 14px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand h1{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:.01em}
.tally{font-family:var(--cond);font-size:1.15rem;font-weight:600;white-space:nowrap}
.shiftbar{display:flex;gap:8px;margin-top:10px}
.shiftbar input[type=date]{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:9px 10px;color:inherit}
.seg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--yellow-ink)}

.banner{background:var(--panel);border-left:5px solid var(--yellow);padding:10px 12px;border-radius:6px;margin-bottom:12px;font-size:.95rem}
.banner.bad{border-left-color:var(--danger);font-weight:600}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card + .card{margin-top:14px}
h2{font-family:var(--cond);font-size:1.35rem;margin:0 0 12px;font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:.92rem;color:var(--muted)}
.field input,.field select{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:1.1rem;min-height:50px}
.field input:focus,.field select:focus,.addrow input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.field.big input{font-family:var(--cond);font-size:1.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.field.big input::placeholder{text-transform:none;font-weight:600}
.timerow{display:flex;gap:8px}
.timerow input{flex:1;min-width:0}
.now{flex:0 0 auto;border:0;border-radius:8px;background:var(--teal);color:var(--teal-ink);font-weight:700;padding:0 16px;min-height:50px;cursor:pointer}
.hint{font-size:.85rem;color:var(--muted);margin-top:-8px;margin-bottom:12px}
.warn{color:var(--danger);font-size:.88rem;font-weight:600;margin:0 0 10px;min-height:0}
.warn:empty{display:none}
.pumps{display:flex;gap:8px}
.pumps button{flex:1;min-height:50px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;font-weight:700;font-size:1.05rem;cursor:pointer}
.pumps button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.primary{width:100%;border:0;border-radius:10px;background:var(--yellow);color:var(--yellow-ink);font-family:var(--cond);font-weight:700;font-size:1.35rem;padding:14px;cursor:pointer;min-height:56px}
.primary:disabled{opacity:.55;cursor:default}
.secondary{display:block;width:100%;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-weight:600;padding:12px;cursor:pointer;margin-top:10px;text-align:center}
.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
button:focus-visible,.filepick:focus-within{outline:3px solid var(--yellow);outline-offset:2px}

.welcome{border:2px solid var(--yellow);margin-bottom:14px}
.welcome p{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.openbox{margin-bottom:12px}
.openbox h3{font-size:.88rem;color:var(--muted);margin:0 0 6px;font-weight:600}

.list{display:flex;flex-direction:column;gap:8px}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.entry.unfinished{border-left:5px solid var(--yellow)}
.entry .bus{font-family:var(--cond);font-size:1.45rem;font-weight:700;grid-row:span 2;min-width:4.2em}
.entry .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .kg{font-family:var(--cond);font-size:1.3rem;font-weight:700;text-align:right;white-space:nowrap}
.entry .times{font-size:.88rem;color:var(--muted)}
.entry .km{font-size:.88rem;color:var(--muted);text-align:right;white-space:nowrap}
.entry .route{grid-column:2 / 4;font-size:.88rem;font-weight:600;color:var(--teal)}
.entry .tag{font-size:.78rem;font-weight:700;background:var(--yellow);color:var(--yellow-ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.sum{display:flex;gap:10px;margin-bottom:12px}
.sum div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-family:var(--cond);font-size:1.5rem}
.sum span{font-size:.85rem;color:var(--muted)}
.recon{margin-top:12px;font-size:.95rem;border-top:1px solid var(--line);padding-top:12px}
.recon:empty{display:none}
.recon p{margin:4px 0;display:flex;justify-content:space-between;gap:10px}
.recon .off{color:var(--danger);font-weight:700}
.recon .good{color:var(--ok);font-weight:700}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.chips.open button{font-family:var(--cond);font-size:1.1rem;border-color:var(--yellow)}

.rtbl{overflow-x:auto;margin:0 -4px}
.rtbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.rtbl th,.rtbl td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rtbl th{font-size:.8rem;color:var(--muted);font-weight:600}
.rtbl th:first-child,.rtbl td:first-child{text-align:left;white-space:normal}
.rtbl tr.tot td{font-weight:700;border-bottom:0}
.addrow{display:flex;gap:8px;margin-bottom:12px}
.addrow input{flex:1;min-width:0;background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:12px;font-size:1.05rem;min-height:50px}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rlist li:last-child{border-bottom:0}
.rlist .rn{font-weight:600}
.rlist .rc{font-size:.85rem;color:var(--muted)}
.rlist .x{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;color:var(--danger)}

.send p{color:var(--muted);font-size:.95rem;margin:0 0 12px}
.send .primary + .primary{margin-top:10px}
.send .month{display:flex;gap:8px}
.send .month input{flex:1;min-width:0;background:var(--field);border:1.5px solid var(--line);border-radius:8px;padding:10px;min-height:50px}
.steps{margin:12px 0 0;padding-left:20px;color:var(--muted);font-size:.92rem}
.steps li{margin:3px 0}
.welcome .steps{margin:0 0 12px;color:var(--ink);font-size:1rem}
.welcome .steps li{margin:6px 0}
.banner.upd{display:flex;align-items:center;justify-content:space-between;gap:10px;border-left-color:var(--teal)}
.banner.upd .now{min-height:42px}
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.meter{height:8px;background:var(--field);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--teal)}
.meter.full i{background:var(--danger)}
.small{font-size:.88rem;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:transparent;padding:12px 4px 13px;font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--yellow)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:360px){ .seg button{padding:9px 11px} nav.tabs button{font-size:.88rem} }
/* v2 additions: language switch, KG calculator, four-pump readings */
.brand .right{display:flex;align-items:baseline;gap:10px}
.langbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:inherit;border-radius:6px;padding:3px 9px;font-family:var(--cond);font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:.04em}
.langpick{display:flex;gap:8px;margin-bottom:14px}
.langpick button{flex:1;min-height:46px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;font-weight:700;cursor:pointer}
.langpick button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.calcbtn{flex:0 0 auto;width:50px;min-height:50px;border:1.5px solid var(--teal);background:var(--panel);color:var(--teal);border-radius:8px;display:grid;place-items:center;cursor:pointer;padding:0}
.calcbtn svg{width:22px;height:22px}
.calc{position:fixed;inset:0;z-index:20;background:rgba(6,25,28,.5);display:flex;align-items:flex-end;justify-content:center}
.calc-in{background:var(--panel);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.calc-in h2{margin-bottom:8px}
.cdisp{background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;text-align:right;min-height:82px}
.cdisp .ex{font-size:1.15rem;color:var(--muted);word-break:break-all;min-height:1.5em;font-variant-numeric:tabular-nums}
.cdisp .res{font-family:var(--cond);font-size:2.3rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.calc-in .hint{margin:6px 0 0}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.keys button{min-height:54px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);font-size:1.4rem;font-weight:700;cursor:pointer}
.keys .op{background:var(--panel);color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%,var(--line))}
.keys .clr{color:var(--danger)}
.keys .eq{grid-row:span 2;background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.keys .zero{grid-column:span 2}
.pumpread{border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.pumpread:first-of-type{border-top:0;padding-top:0}
.pumpread h3{font-family:var(--cond);font-size:1.2rem;margin:0 0 8px}
.pumpread .grid2 .field{margin-bottom:6px}
.pumpread .filled{font-size:.9rem;color:var(--muted);margin:0 0 12px;min-height:1.2em}
.field input.pre{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 12%,var(--field))}
.recon p.sum{border-top:1px solid var(--line);padding-top:6px;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>CNG Fuel Log</h1><div class="right"><button type="button" class="langbtn" id="langBtn" aria-label="Kiswahili">SW</button><div class="tally" id="tally"></div></div></div>
    <div class="shiftbar">
      <input type="date" id="date" data-i18n-aria="date.aria">
      <div class="seg" role="group">
        <button type="button" data-shift="day" aria-pressed="true" data-i18n="shift.day">Day</button>
        <button type="button" data-shift="night" aria-pressed="false" data-i18n="shift.night">Night</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="banner upd" id="upd" hidden><span data-i18n="upd.text"></span><button type="button" class="now" id="updBtn" data-i18n="upd.btn"></button></div>

  <!-- ADD -->
  <section class="view" id="v-add">
    <div class="card welcome" id="install" hidden>
      <h2 data-i18n="inst.h"></h2>
      <p id="instText"></p>
      <ol class="steps" id="instSteps" hidden></ol>
      <button class="primary" id="instBtn" type="button" hidden data-i18n="inst.btn"></button>
      <button class="secondary" id="instLater" type="button" data-i18n="inst.later"></button>
    </div>

    <div class="card welcome" id="welcome" hidden>
      <h2 data-i18n="welcome.h"></h2>
      <div class="langpick" role="group" data-i18n-aria="welcome.lang">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="sw">Kiswahili</button>
      </div>
      <p data-i18n="welcome.p"></p>
      <div class="field"><label for="wName" data-i18n="welcome.name"></label><input id="wName" autocapitalize="words" autocomplete="off"></div>
      <button class="primary" id="wSave" type="button" data-i18n="welcome.start"></button>
    </div>

    <div class="openbox" id="openBox" hidden>
      <h3 data-i18n="open.title"></h3>
      <div class="chips open" id="openChips"></div>
    </div>

    <form class="card" id="form" autocomplete="off" novalidate>
      <h2 id="formTitle"></h2>
      <div class="field big">
        <label for="bus" data-i18n="f.bus"></label>
        <input id="bus" list="busList" inputmode="text" data-i18n-ph="f.bus.ph" required>
        <datalist id="busList"></datalist>
      </div>
      <div class="field">
        <label for="driver" data-i18n="f.driver"></label>
        <input id="driver" list="driverList" autocapitalize="words">
        <datalist id="driverList"></datalist>
      </div>
      <div class="field">
        <label for="route" data-i18n="f.route"></label>
        <select id="route"><option value=""></option></select>
      </div>
      <p class="hint" id="routeHint" data-i18n="f.route.hint"></p>
      <div class="field">
        <label for="arrival" data-i18n="f.arrival"></label>
        <div class="timerow"><input type="time" id="arrival"><button type="button" class="now" data-now="arrival" data-i18n="now"></button></div>
      </div>
      <div class="field">
        <label for="tin" data-i18n="f.in"></label>
        <div class="timerow"><input type="time" id="tin"><button type="button" class="now" data-now="tin" data-i18n="now"></button></div>
      </div>
      <div class="field">
        <label for="tout" data-i18n="f.out"></label>
        <div class="timerow"><input type="time" id="tout"><button type="button" class="now" data-now="tout" data-i18n="now"></button></div>
      </div>
      <div class="field">
        <label data-i18n="f.pump"></label>
        <div class="pumps" role="group">
          <button type="button" data-pump="1" aria-pressed="false">1</button>
          <button type="button" data-pump="2" aria-pressed="false">2</button>
          <button type="button" data-pump="3" aria-pressed="false">3</button>
          <button type="button" data-pump="4" aria-pressed="false">4</button>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label for="kg" data-i18n="f.kg"></label>
          <div class="timerow"><input id="kg" type="number" inputmode="decimal" step="0.01" min="0">
            <button type="button" class="calcbtn" id="calcOpen" data-i18n-aria="calc.open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><rect x="7.5" y="5.5" width="9" height="4" rx="1"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"/></svg></button></div></div>
        <div class="field"><label for="km" data-i18n="f.km"></label><input id="km" type="number" inputmode="decimal" step="0.1" min="0"></div>
      </div>
      <p class="hint" data-i18n="form.later"></p>
      <p class="warn" id="formWarn" role="alert"></p>
      <button class="primary" id="saveBtn" type="submit"></button>
      <button class="secondary" id="cancelEdit" type="button" hidden data-i18n="cancel.edit"></button>
      <button class="secondary danger" id="deleteBtn" type="button" hidden data-i18n="delete.entry"></button>
    </form>
  </section>

  <!-- LOG -->
  <section class="view" id="v-log" hidden>
    <div class="sum">
      <div><b id="sBuses">0</b><span data-i18n="log.buses"></span></div>
      <div><b id="sKg">0</b><span data-i18n="log.kg"></span></div>
      <div><b id="sWait">–</b><span data-i18n="log.wait"></span></div>
    </div>
    <div class="chips" id="logFilter" role="group" data-i18n-aria="log.filter"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- ROUTES -->
  <section class="view" id="v-route" hidden>
    <div class="card">
      <h2 data-i18n="route.sum"></h2>
      <div class="rtbl" id="routeSum"></div>
    </div>
    <div class="card">
      <h2 data-i18n="route.h"></h2>
      <div class="addrow"><input id="newRoute" data-i18n-ph="route.ph" data-i18n-aria="route.new" autocapitalize="words"><button class="now" id="addRoute" type="button" data-i18n="route.add"></button></div>
      <ul class="rlist" id="routeList"></ul>
    </div>
  </section>

  <!-- READINGS -->
  <section class="view" id="v-read" hidden>
    <form class="card" id="rform" novalidate>
      <h2 data-i18n="read.h"></h2>
      <p class="hint" id="preHint" hidden data-i18n="read.prefill" style="margin:0 0 12px"></p>
      <div id="pumpInputs"></div>
      <div class="field"><label for="att" data-i18n="read.att"></label><input id="att" autocapitalize="words"></div>
      <div class="field"><label for="notes" data-i18n="read.notes"></label><input id="notes"></div>
      <button class="primary" id="rsave" type="submit" data-i18n="read.save"></button>
      <div class="recon" id="recon"></div>
    </form>
  </section>

  <!-- SEND -->
  <section class="view send" id="v-send" hidden>
    <div class="card">
      <h2 data-i18n="send.h"></h2>
      <p data-i18n="send.p"></p>
      <button class="primary" id="xShift" type="button" data-i18n="x.shift"></button>
      <button class="primary" id="xDay" type="button" data-i18n="x.day"></button>
      <button class="secondary" id="waSum" type="button" data-i18n="wa.btn"></button>
      <ol class="steps"><li data-i18n-html="step1"></li><li data-i18n-html="step2"></li><li data-i18n-html="step3"></li></ol>
    </div>

    <div class="card">
      <h2 data-i18n="month.h"></h2>
      <p data-i18n="month.p"></p>
      <div class="month"><input type="month" id="month" data-i18n-aria="month.aria"><button class="now" id="xMonth" type="button" data-i18n="month.btn"></button></div>
    </div>

    <div class="card">
      <h2 data-i18n="imp.h"></h2>
      <p data-i18n="imp.p"></p>
      <label class="secondary filepick"><span data-i18n="imp.btn"></span><input type="file" id="imp" data-i18n-aria="imp.aria"></label>
    </div>

    <div class="card">
      <h2 data-i18n="phone.h"></h2>
      <div class="field"><label for="devName" data-i18n="phone.name"></label><input id="devName" autocapitalize="words" autocomplete="off"></div>
      <p class="small" id="storeInfo"></p>
      <div class="meter" id="meter"><i id="meterBar" style="width:0%"></i></div>
      <p class="small" id="lastSave"></p>
      <button class="secondary" id="backup" type="button" data-i18n="backup"></button>
      <button class="secondary" id="shareApp" type="button" hidden data-i18n="shareapp"></button>
      <p class="small" style="margin-top:14px" data-i18n="full.p"></p>
      <div class="month"><input type="month" id="delMonth" data-i18n-aria="delmonth.aria"><button class="secondary danger" id="delBtn" type="button" style="width:auto;margin:0;padding:0 16px" data-i18n="remove"></button></div>
    </div>
  </section>
</div>

<!-- KG calculator -->
<div class="calc" id="calc" hidden role="dialog" aria-modal="true" aria-labelledby="calcH">
  <div class="calc-in">
    <h2 id="calcH" data-i18n="calc.h"></h2>
    <div class="cdisp"><div class="ex" id="cEx"></div><div class="res" id="cRes">0</div></div>
    <p class="hint" data-i18n="calc.hint"></p>
    <div class="keys" id="keys">
      <button type="button" class="clr" data-k="C">C</button><button type="button" class="op" data-k="B" aria-label="Delete">⌫</button><button type="button" class="op" data-k="÷">÷</button><button type="button" class="op" data-k="×">×</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="op" data-k="−">−</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="op" data-k="+">+</button>
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="eq" data-k="=">=</button>
      <button type="button" class="zero" data-k="0">0</button><button type="button" data-k=".">.</button>
    </div>
    <button class="primary" id="cUse" type="button"></button>
    <button class="secondary" id="cClose" type="button" data-i18n="calc.close"></button>
  </div>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-tab="add" aria-selected="true" data-i18n="tab.add"></button>
    <button role="tab" data-tab="log" aria-selected="false" data-i18n="tab.log"></button>
    <button role="tab" data-tab="route" aria-selected="false" data-i18n="tab.route"></button>
    <button role="tab" data-tab="read" aria-selected="false" data-i18n="tab.read"></button>
    <button role="tab" data-tab="send" aria-selected="false" data-i18n="tab.send"></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

let LANG = "en";
function t(k, v){
  let s = (I18N[LANG] && I18N[LANG][k]) ?? I18N.en[k] ?? k;
  if(v) s = s.replace(/\{(\w+)\}/g, (m,x) => v[x] ?? m);
  return s;
}
const busesLabel = n => n===1 ? t("bus1") : t("busesN",{n});


const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm = d => pad(d.getHours())+":"+pad(d.getMinutes());
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = t => { if(!t || !/^\d{1,2}:\d{2}/.test(t)) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
const diff = (a,b) => { const x=mins(a), y=mins(b); if(x==null||y==null) return null; let d=y-x; if(d<0) d+=1440; return d; };
const num = v => { if(v===""||v==null) return null; const n=Number(v); return isFinite(n) ? n : null; };
const r2 = n => Math.round(n*100)/100;
const fmt = n => r2(n).toLocaleString("en-US");
const dmy = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4) : "";
const monthLabel = m => t("months").split(",")[+m.slice(5,7)-1]+" "+m.slice(0,4);
const shiftLabel = s => t(s==="night" ? "shift.night" : "shift.day");
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
const safeName = s => String(s||"").trim().replace(/\s+/g,"-").replace(/[^A-Za-z0-9_-]/g,"").slice(0,24);
const normBus = v => String(v||"").toUpperCase().replace(/\s+/g," ").trim();
const PUMPS = [1,2,3,4];

// Default shift: 06:00–17:59 day; 18:00–23:59 night; 00:00–05:59 counts as the previous date's night.
function defaultShift(){
  const n=new Date(), h=n.getHours();
  if(h>=6 && h<18) return {date:ymd(n), shift:"day"};
  if(h>=18) return {date:ymd(n), shift:"night"};
  const y=new Date(n); y.setDate(y.getDate()-1); return {date:ymd(y), shift:"night"};
}

/* ---------- storage on this phone ---------- */
const blank = () => ({v:1, entries:{}, shifts:{}, routes:{}, meta:{device:"", lastExport:0, lang:""}});
let store = blank();
let canSave = true;

function storageWorks(){
  try{ const k=KEY+":test"; localStorage.setItem(k,"1"); const ok=localStorage.getItem(k)==="1"; localStorage.removeItem(k); return ok; }
  catch(e){ return false; }
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    const d = raw ? JSON.parse(raw) : null;
    const b = blank();
    store = (d && d.v===1) ? { ...b, ...d, meta:{...b.meta, ...(d.meta||{})} } : b;
    ["entries","shifts","routes"].forEach(k=>{ if(!store[k] || typeof store[k]!=="object") store[k]={}; });
  }catch(e){ store = blank(); }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); canSave=true; return true; }
  catch(e){
    canSave=false;
    const full = e && (e.name==="QuotaExceededError" || e.code===22 || e.code===1014);
    banner(t(full ? "ban.full" : "ban.fail"), true);
    return false;
  }
}

const S = { ...defaultShift(), routeFilter:"all", editingId:null, pump:null, fleet:{}, busRoute:{} };

function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2800); }
function banner(msg,bad){ const b=$("#banner"); if(!msg){ b.hidden=true; return; } b.textContent=msg; b.classList.toggle("bad",!!bad); b.hidden=false; }

/* ---------- data helpers ---------- */
const active = () => Object.values(store.entries).filter(e=>e && !e.deleted);
const skey = (d,s) => d+"|"+s;
function sortKey(e){
  let m = mins(e.arrival||e.pumpIn||e.pumpOut);
  if(m==null) return 100000 + (e.createdAt||0)/1e9;
  if(e.shift==="night" && m<720) m+=1440;
  return m;
}
function shiftEntries(d=S.date, s=S.shift){ return active().filter(e=>e.date===d && e.shift===s).sort((a,b)=>sortKey(a)-sortKey(b)); }
function routeNames(){ return Object.values(store.routes).filter(r=>r && !r.deleted).map(r=>r.name).sort((a,b)=>a.localeCompare(b)); }
function derive(){
  const f={}, r={}, tm={};
  for(const e of active()){
    if(!e.bus) continue; const u=e.updatedAt||0;
    if(!(e.bus in tm) || u>=tm[e.bus]){ tm[e.bus]=u; if(e.driver) f[e.bus]=e.driver; if(e.route) r[e.bus]=e.route; }
  }
  S.fleet=f; S.busRoute=r;
}
function totals(list){
  let kg=0, km=0, w=0, wn=0;
  list.forEach(e=>{ kg+=e.kg||0; km+=e.km||0; const x=diff(e.arrival,e.pumpIn); if(x!=null){ w+=x; wn++; } });
  return {n:list.length, kg, km, wait: wn ? Math.round(w/wn) : null};
}
function byRoute(list){
  const m=new Map(), none=t("log.noroute");
  list.forEach(e=>{ const k=e.route||none; const o=m.get(k)||{route:k,n:0,kg:0,km:0,none:!e.route}; o.n++; o.kg+=e.kg||0; o.km+=e.km||0; m.set(k,o); });
  return [...m.values()].sort((a,b)=> a.none-b.none || b.kg-a.kg);
}
function loggedByPump(list){
  const logged={"1":0,"2":0,"3":0,"4":0,none:0};
  list.forEach(e=>{ const k=e.pump&&logged[e.pump]!=null ? e.pump : "none"; logged[k]+=e.kg||0; });
  return logged;
}
function meters(doc){
  const m={}; PUMPS.forEach(p=>{ const o=doc["p"+p+"o"], c=doc["p"+p+"c"]; m[p] = o!=null && c!=null ? c-o : null; }); return m;
}
// Closing reading from the shift before this one, used to suggest the opening.
function previousClosing(d,s,p){
  const k="p"+p+"c";
  if(s==="night"){ const v=(store.shifts[skey(d,"day")]||{})[k]; if(v!=null) return v; }
  const y=new Date(d+"T12:00:00"); y.setDate(y.getDate()-1); const pd=ymd(y);
  const n=(store.shifts[skey(pd,"night")]||{})[k]; if(n!=null) return n;
  if(s==="day"){ const dd=(store.shifts[skey(pd,"day")]||{})[k]; if(dd!=null) return dd; }
  return null;
}

/* ---------- language ---------- */
function applyLang(){

/* ---------- KG calculator ---------- */
const CALC = {ex:""};
const OPS = "+−×÷";
function calcValue(src){
  const s=src.replace(/[+−×÷]+$/,""); if(!s) return null;
  const tk=s.match(/\d+\.?\d*|\.\d+|[+−×÷]/g); if(!tk || tk.join("")!==s) return null;
  const nums=[], ops=[]; let want=true, neg=false;
  for(const x of tk){
    if(OPS.includes(x)){
      if(want){ if(x==="−"){ neg=!neg; continue; } if(x==="+") continue; return null; }
      ops.push(x); want=true;
    } else { let v=parseFloat(x); if(neg) v=-v; neg=false; nums.push(v); want=false; }
  }
  if(!nums.length) return null;
  const vals=[nums[0]], add=[];
  for(let i=0;i<ops.length;i++){
    const op=ops[i], b=nums[i+1];
    if(op==="×") vals[vals.length-1]*=b;
    else if(op==="÷"){ if(b===0) return null; vals[vals.length-1]/=b; }
    else { add.push(op); vals.push(b); }
  }
  let r=vals[0]; add.forEach((op,i)=>{ r = op==="+" ? r+vals[i+1] : r-vals[i+1]; });
  return isFinite(r) ? Math.round(r*1e6)/1e6 : null;
}
function renderCalc(){
  const v=calcValue(CALC.ex);
  $("#cEx").textContent=CALC.ex || " ";
  $("#cRes").textContent= v==null ? (CALC.ex?"…":"0") : fmt(v);
  const ok = v!=null && v>=0;
  $("#cUse").disabled=!ok;
  $("#cUse").textContent=t("calc.use",{v: ok ? r2(v) : "–"});
}
function calcKey(k){
  let ex=CALC.ex;
  if(k==="C") ex="";
  else if(k==="B") ex=ex.slice(0,-1);
  else if(k==="="){ const v=calcValue(ex); if(v!=null) ex=String(r2(v)); }
  else if(OPS.includes(k)){
    if(!ex){ if(k==="−") ex="−"; }
    else if(OPS.includes(ex.slice(-1))) ex = ex.length===1 ? (k==="−"?"−":"") : ex.slice(0,-1)+k;
    else ex+=k;
  }
  else if(k==="."){ const last=ex.split(/[+−×÷]/).pop(); if(!last.includes(".")) ex += last==="" ? "0." : "."; }
  else { if(ex.replace(/[+−×÷]/g,"").length<24) ex+=k; }
  CALC.ex=ex; renderCalc();
}
function openCalc(){
  const cur=$("#kg").value; CALC.ex = cur && num(cur)!=null ? String(num(cur)) : "";
  renderCalc(); $("#calc").hidden=false; document.body.style.overflow="hidden";
}
function closeCalc(){ $("#calc").hidden=true; document.body.style.overflow=""; $("#calcOpen").focus(); }
$("#calcOpen").addEventListener("click",openCalc);
$("#keys").addEventListener("click",e=>{ const b=e.target.closest("button[data-k]"); if(b) calcKey(b.dataset.k); });
$("#cUse").addEventListener("click",()=>{ const v=calcValue(CALC.ex); if(v==null||v<0) return; $("#kg").value=r2(v); closeCalc(); });
$("#cClose").addEventListener("click",closeCalc);
$("#calc").addEventListener("click",e=>{ if(e.target.id==="calc") closeCalc(); });
document.addEventListener("keydown",e=>{
  if($("#calc").hidden) return;
  if(e.key==="Escape") return closeCalc();
  const map={"*":"×","/":"÷","-":"−","+":"+","Enter":"=","=":"=","Backspace":"B",".":".",",":"."};
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if(k){ e.preventDefault(); calcKey(k); }
});

function dataPayload(keys){
  const want=new Set(keys.map(([d,s])=>skey(d,s)));
  const entries={}, shifts={};
  Object.values(store.entries).forEach(e=>{ if(e && want.has(skey(e.date,e.shift))) entries[e.id]=e; });
  want.forEach(k=>{ if(store.shifts[k]) shifts[k]=store.shifts[k]; });
  return {app:APP, v:1, from:store.meta.device||"", at:Date.now(), entries, shifts, routes:store.routes};
}

/* ---------- Excel in the office master layout (OCTOBER_CNG_TEMPLATE_2026.xlsx) ----------
   One sheet per date named DD.MM.YYYY. Day block, night block, GAS totals, then the pump check.
   Styles, theme, column widths and label texts come from the template itself (TPL).
   Weekdays have 70 rows per shift, Saturdays 57, Sundays 33 (as in the template); more rows are

function sheetBuilder(){

  return {

  const DAY={A:4,B:4,C:4,D:4,E:4,F:5,G:6,H:6,I:6,J:4,K:4}, NIGHT={A:7,B:4,C:7,D:7,E:7,F:8,G:9,H:9,I:6,J:7,K:7};
  const tval = v => { const m=mins(v); return m==null ? null : m/1440; };
  const busRow=(r,i,e,st)=>{

    B.cell("H"+r, ti!=null ? cN(st.H,ti) : cE(st.H));

    B.cell("K"+r, e&&e.route ? cS(st.K,e.route) : cE(st.K));
  };
  for(let i=0;i<N;i++) busRow(4+i,i+1,day[i],DAY);
  const dayKg=day.reduce((a,e)=>a+(e.kg||0),0), nightKg=night.reduce((a,e)=>a+(e.kg||0),0);
  span(daySum,"A","D",10); B.cell("E"+daySum,cE(11)); B.cell("F"+daySum,cF(36,`SUM(F4:F${daySum-1})`,dayKg)); B.cell("G"+daySum,cE(24)); B.cell("H"+daySum,cE(22)); B.merge(`F${daySum}:H${daySum}`);
  B.cell("A"+nT,cS(38,S.night)); span(nT,"B","J",39); B.cell("K"+nT,cE(40));
  B.cell("A"+(nT+1),cE(41)); span(nT+1,"B","J",42); B.cell("K"+(nT+1),cE(43)); B.merge(`A${nT}:K${nT+1}`);
  for(let i=0;i<M;i++) busRow(n0+i,i+1,night[i],NIGHT);
  B.cell("F"+nightSum,cF(36,`SUM(F${n0}:F${nightSum-1})`,nightKg)); B.cell("G"+nightSum,cE(24)); B.cell("H"+nightSum,cE(22)); B.merge(`F${nightSum}:H${nightSum}`); B.row(nightSum,fixed);
  B.cell("F"+tot,cF(35,`F${daySum}+F${nightSum}`,dayKg+nightKg)); B.cell("G"+tot,cE(24)); B.cell("H"+tot,cE(22)); B.merge(`F${tot}:H${tot}`); B.row(tot,fixed);
  B.row(F-1,fixed);

  // pump meter blocks: pumps 2|3 exactly as the template, then pumps 1|4 in the same style
  const pumpLabel = n => S.pump.replace(/2\s*$/, String(n));
  const filledVal={}, closedRow={}, closeOut={};
  const block=(base,left,right,withRecordBox)=>{
    for(let r=base;r<=base+4;r++) B.row(r,fixed);
    B.cell("D"+base,cS(12,S.mtr)); B.cell("E"+base,cS(28,S.lake)); B.cell("F"+base,cE(22)); B.cell("G"+base,cS(12,S.mtr)); B.cell("H"+base,cE(1)); B.merge(`E${base}:F${base}`);

      B.cell("B"+r,cS(21,lab)); B.cell("C"+r,cE(22)); B.merge(`B${r}:C${r}`);
      B.cell("G"+r,cS(21,lab)); B.cell("H"+r,cE(22)); B.merge(`G${r}:H${r}`);

    [[left,"D",18,15,19],[right,"I",29,29,30]].forEach(([p,col,so,sc,sf])=>{

      else oc=cE(so);
      B.cell(col+o,oc);
      const cv=isNum(rd.c[p]) ? rd.c[p] : null;

      B.cell(col+f,cF(sf,`IF(${col}${c}="","",${col}${c}-${col}${o})`,fv));

      B.cell("E"+f,cS(14,S.allshift)); B.cell("F"+f,cE(17));

  const a=F+11; for(let r=a;r<=a+8;r++) B.row(r,fixed);
  B.cell("B"+a,cS(21,S.amount)); span(a,"C","F",24); B.cell("G"+a,cE(22)); B.merge(`B${a}:G${a}`);
  const line=(r,label,s,f,v)=>{ B.cell("C"+r,cS(21,label)); B.cell("D"+r,cE(22)); B.merge(`C${r}:D${r}`); B.cell("E"+r,cF(s,f,v)); B.cell("F"+r,cE(22)); B.merge(`E${r}:F${r}`); };
  [1,2,3,4].forEach((p,i)=>line(a+1+i,pumpLabel(p),30,filledVal[p].ref,filledVal[p].v));
  const meters=[1,2,3,4].map(p=>filledVal[p].v).filter(isNum);
  const lake = meters.length ? meters.reduce((x,y)=>x+y,0) : "";
  line(a+5,S.laketotal,33,`IF(COUNT(E${a+1}:E${a+4})=0,"",SUM(E${a+1}:E${a+4}))`,lake);
  line(a+6,S.mofat,37,`F${tot}`,dayKg+nightKg);
  line(a+7,S.diff,23,`IF(E${a+5}="","",E${a+5}-E${a+6})`, isNum(lake) ? lake-(dayKg+nightKg) : "");
  const last=a+7;

  const {rows,merges}=B.xml();

  return {xml, closedRow, close:closeOut};
}

// Hidden sheet holding the raw data, so another phone can add this file to its log.
function dataSheetXml(payload){
  const s=JSON.stringify(payload), parts=["CNG Fuel Log data – do not edit this sheet"];
  for(let i=0;i<s.length;i+=30000) parts.push(s.slice(i,i+30000));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>`+
    parts.map((p,i)=>`<row r="${i+1}"><c r="A${i+1}" t="inlineStr"><is><t xml:space="preserve">${XE(p)}</t></is></c></row>`).join("")+`</sheetData></worksheet>`;
}

function buildXlsx(sheets){
  const C=XLSX.CFB, z=C.utils.cfb_new({root:"R"}), enc=new TextEncoder();
  const add=(p,s)=>C.utils.cfb_add(z,p,enc.encode(s));
  const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const WS="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml";
  add("[Content_Types].xml", H+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>`+
    `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`+
    sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="${WS}"/>`).join("")+

    `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`);
  add("_rels/.rels", H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  add("xl/workbook.xml", H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><workbookPr/><bookViews><workbookView activeTab="0"/></bookViews><sheets>`+
    sheets.map((s,i)=>`<sheet name="${XE(s.name)}" sheetId="${i+1}"${s.hidden?' state="hidden"':''} r:id="rId${i+1}"/>`).join("")+
    `</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`);
  const n=sheets.length;
  add("xl/_rels/workbook.xml.rels", H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`+
    sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+
    `<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>`+
    `<Relationship Id="rId${n+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add("xl/styles.xml", TPL.styles);
  add("xl/theme/theme1.xml", TPL.theme);
  sheets.forEach((s,i)=>add(`xl/worksheets/sheet${i+1}.xml`, s.xml));

/* Readings for a date sheet. The master records one opening and one closing per date:
   opening = first shift's opening, closing = last shift's closing. */
function dateReadings(d, shifts){
  const dd=store.shifts[skey(d,"day")]||{}, nd=store.shifts[skey(d,"night")]||{};
  const hasD=shifts.includes("day"), hasN=shifts.includes("night"), o={}, c={};
  [1,2,3,4].forEach(p=>{
    const ko="p"+p+"o", kc="p"+p+"c";
    o[p] = hasD&&isNum(dd[ko]) ? dd[ko] : hasN&&isNum(nd[ko]) ? nd[ko] : null;
    c[p] = hasN&&isNum(nd[kc]) ? nd[kc] : hasD&&isNum(dd[kc]) ? dd[kc] : null;
  });
  return {o,c};
}

// dates: sorted YYYY-MM-DD; shifts: which shifts to include; chainOpenings: link each opening to the previous sheet's closing
function masterWorkbook(dates, shifts, chainOpenings){
  const sheets=[]; let prev=null;
  dates.forEach((d,i)=>{
    const day = shifts.includes("day") ? shiftEntries(d,"day") : [];
    const night = shifts.includes("night") ? shiftEntries(d,"night") : [];
    const res = masterSheet(d, day, night, dateReadings(d,shifts), chainOpenings?prev:null, i===0);
    sheets.push({name:sheetDate(d), xml:res.xml});
    prev={name:sheetDate(d), closedRow:res.closedRow, close:res.close};
  });
  const keys=[]; dates.forEach(d=>shifts.forEach(s=>keys.push([d,s])));
  sheets.push({name:"_data", xml:dataSheetXml(dataPayload(keys)), hidden:true});
  return buildXlsx(sheets);
}

const cs = v => v==null ? "" : String(v).slice(0,120);
const ct = v => /^\d{2}:\d{2}$/.test(v||"") ? v : "";
const cn = v => num(v);
function cleanEntry(e){
  if(!e || typeof e!=="object" || typeof e.id!=="string" || !/^\d{4}-\d{2}-\d{2}$/.test(e.date||"")) return null;
  return { id:e.id.slice(0,64), date:e.date, shift:e.shift==="night"?"night":"day", bus:normBus(cs(e.bus)), driver:cs(e.driver), route:cs(e.route),
    arrival:ct(e.arrival), pumpIn:ct(e.pumpIn), pumpOut:ct(e.pumpOut), pump:["1","2","3","4"].includes(String(e.pump))?String(e.pump):null,
    kg:cn(e.kg), km:cn(e.km), by:cs(e.by), createdAt:cn(e.createdAt)||0, updatedAt:cn(e.updatedAt)||0, deleted:!!e.deleted };
}
function cleanShift(d){
  if(!d || typeof d!=="object") return null;
  const o={ att:cs(d.att), notes:cs(d.notes), by:cs(d.by), updatedAt:cn(d.updatedAt)||0 };
  PUMPS.forEach(p=>{ o["p"+p+"o"]=cn(d["p"+p+"o"]); o["p"+p+"c"]=cn(d["p"+p+"c"]); });
  return o;
}
function merge(p){
  let added=0, updated=0, readings=0;
  Object.values(p.entries||{}).forEach(raw=>{
    const e=cleanEntry(raw); if(!e) return; const cur=store.entries[e.id];
    if(!cur){ store.entries[e.id]=e; if(!e.deleted) added++; }
    else if(e.updatedAt>(cur.updatedAt||0)){ store.entries[e.id]=e; updated++; }
  });
  Object.entries(p.shifts||{}).forEach(([k,raw])=>{
    if(!/^\d{4}-\d{2}-\d{2}\|(day|night)$/.test(k)) return; const d=cleanShift(raw); if(!d) return;
    const cur=store.shifts[k]; if(!cur || d.updatedAt>(cur.updatedAt||0)){ store.shifts[k]=d; readings++; }
  });
  Object.entries(p.routes||{}).forEach(([k,r])=>{
    if(!r || typeof r.name!=="string") return; const key=String(k).toLowerCase().slice(0,120);
    const nr={name:cs(r.name), updatedAt:cn(r.updatedAt)||0, ...(r.deleted?{deleted:true}:{})};
    const cur=store.routes[key]; if(!cur || nr.updatedAt>(cur.updatedAt||0)) store.routes[key]=nr;
  });
  return {added, updated, readings};
}
$("#imp").addEventListener("change",async ev=>{
  const file=ev.target.files && ev.target.files[0]; ev.target.value=""; if(!file) return;
  try{
    let p;
    const head=new Uint8Array(await file.slice(0,2).arrayBuffer());
    if(head[0]===0x50 && head[1]===0x4B){ // .xlsx (zip)
      const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
      const ws=wb.Sheets["_data"]; if(!ws) throw new Error(t("imp.notours"));
      let s=""; for(let r=2; ws["A"+r]; r++) s+=String(ws["A"+r].v);
      p=JSON.parse(s);
    } else { p=JSON.parse(await file.text()); }
    if(!p || p.app!==APP) throw new Error(t("imp.notours"));
    const res=merge(p);
    if(!persist()) return;
    renderAll(true); renderSend();
    const from=p.from ? t("imp.from",{n:p.from}) : "";
    toast(res.added||res.updated||res.readings ? t("imp.added",{n:res.added, u:res.updated?t("imp.updated",{n:res.updated}):"", from}) : t("imp.nothing",{from}));
  }catch(e){
    toast(e && e.message && !/JSON|token|Unexpected/i.test(e.message) ? e.message : t("imp.bad"));
  }
});

    try{
      const mine=(await caches.keys()).filter(k=>k.startsWith("cng-fuel-log-"));
      if(mine.length && !mine.includes("cng-fuel-log-"+BUILD)) $("#upd").hidden=false;
    }catch(e){}
  }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.addEventListener("controllerchange",()=>setTimeout(staleCheck,300));
    navigator.serviceWorker.register("sw.js").then(reg=>{
      const check=()=>{ if(navigator.onLine) reg.update().catch(()=>{}).then(()=>setTimeout(staleCheck,2500)); };
      check(); staleCheck();
      document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
    }).catch(()=>{});
  }
  $("#updBtn").addEventListener("click",()=>location.reload());

  /* send the app link */
  $("#shareApp").hidden=false;
  $("#shareApp").addEventListener("click",async()=>{
    const text=t("share.text");
    if(navigator.share){ try{ await navigator.share({title:"CNG Fuel Log", text, url:appUrl}); return; }catch(e){ if(e && e.name==="AbortError") return; } }
    location.href="whatsapp://send?text="+encodeURIComponent(text+" "+appUrl);
  });

  /* install card */
  if(standalone) return;
  let snoozed=false;
  try{ const v=+localStorage.getItem(LATER); snoozed = v && Date.now()-v < 3*864e5; }catch(e){}
  let deferred=null, mode=null;
  const card=$("#install");
  const MODES = {
    prompt:  {text:"inst.prompt",  steps:[], button:true},
    ios:     {text:"inst.ios",     steps:["inst.ios1","inst.ios2","inst.ios3"]},
    inapp:   {text:"inst.inapp",   steps:["inst.inapp1","inst.inapp2"]},
    android: {text:"inst.android", steps:["inst.and1","inst.and2"]}
  };
  function render(){
    if(!mode) return; const m=MODES[mode];
    $("#instText").textContent=t(m.text);
    $("#instSteps").innerHTML=m.steps.map(k=>"<li>"+t(k)+"</li>").join("");
    $("#instSteps").hidden=!m.steps.length;
    $("#instBtn").hidden=!m.button;
  }
  function show(m){ mode=m; render(); card.hidden=false; }
  window.pwaRelang = render;
  $("#instLater").addEventListener("click",()=>{
    card.hidden=true; try{ localStorage.setItem(LATER,String(Date.now())); }catch(e){}
    if(!store.meta.device && canSave) $("#welcome").hidden=false;
  });
  $("#instBtn").addEventListener("click",async()=>{
    if(!deferred) return;
    deferred.prompt();
    try{ const c=await deferred.userChoice; if(c && c.outcome==="accepted") card.hidden=true; }catch(e){}
    deferred=null; $("#instBtn").hidden=true;
  });
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; show("prompt"); });
  window.addEventListener("appinstalled",()=>{ card.hidden=true; toast(t("inst.done")); });

  if(snoozed) return;
  if(iOS){
    if(inApp) show("inapp");
    else { $("#welcome").hidden=true; show("ios"); } // set the name inside the installed app, not in Safari
  } else if(android){
    // Chrome shows its own prompt within a few seconds when it can; otherwise explain the menu.
    setTimeout(()=>{ if(!deferred && card.hidden) show("android"); }, 3500);
  }
})();
</script>
</body>
</html>
